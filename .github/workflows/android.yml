name: Build DriveCast Server APK

on:
  push:
    branches: [studio-v1, main]
    paths: ["studio/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Server tests
        working-directory: studio/server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install requests PySocks cryptography tzdata yt-dlp
          python -m unittest discover -s tests -v

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build tunnel (Tailscale Funnel) for Android
        working-directory: studio/tunnel
        run: |
          go get tailscale.com@latest
          go mod tidy
          # Android build of Tailscale (no netlink problems), with the HTTPS certificate
          # LocalAPI switched on. Tailscale only disables that one file for Android;
          # the certificate code itself has no Android restriction.
          go mod vendor
          sed -i 's#^//go:build !ios \&\& !android \&\& !js#//go:build !ios \&\& !js#' vendor/tailscale.com/ipn/localapi/cert.go
          sed -i 's#^//go:build ios || android || js#//go:build ios || js#' vendor/tailscale.com/ipn/localapi/disabled_stubs.go
          head -4 vendor/tailscale.com/ipn/localapi/cert.go | tail -1
          head -4 vendor/tailscale.com/ipn/localapi/disabled_stubs.go | tail -1
          grep -q '!android' vendor/tailscale.com/ipn/localapi/cert.go && { echo "cert patch failed"; exit 1; }
          BIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          OUT=../android/app/src/main/jniLibs
          mkdir -p $OUT/arm64-v8a $OUT/armeabi-v7a
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC=$BIN/aarch64-linux-android26-clang \
            go build -mod=vendor -trimpath -ldflags="-s -w" -o $OUT/arm64-v8a/libdctunnel.so .
          CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 CC=$BIN/armv7a-linux-androideabi26-clang \
            go build -mod=vendor -trimpath -ldflags="-s -w" -o $OUT/armeabi-v7a/libdctunnel.so .
          ls -la $OUT/*

      - name: Pick cloudflared version
        id: cfv
        run: |
          TAG=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/cloudflare/cloudflared | sed 's#.*/##' | grep -E '^[0-9]{4}\.[0-9]+\.[0-9]+$' | head -1)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "cloudflared $TAG"

      - name: Cache cloudflared for Android
        id: cfcache
        uses: actions/cache@v4
        with:
          path: cfbin
          key: cloudflared-android-${{ steps.cfv.outputs.tag }}

      - name: Build cloudflared for Android (own domain via Cloudflare Tunnel)
        if: steps.cfcache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 -b ${{ steps.cfv.outputs.tag }} https://github.com/cloudflare/cloudflared cfsrc
          cd cfsrc
          BIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          LD="-s -w -X main.Version=${{ steps.cfv.outputs.tag }}"
          mkdir -p ../cfbin
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC=$BIN/aarch64-linux-android26-clang \
            go build -trimpath -ldflags="$LD" -o ../cfbin/arm64 ./cmd/cloudflared
          CGO_ENABLED=1 GOOS=android GOARCH=arm GOARM=7 CC=$BIN/armv7a-linux-androideabi26-clang \
            go build -trimpath -ldflags="$LD" -o ../cfbin/arm ./cmd/cloudflared
          ls -la ../cfbin

      - name: Add cloudflared to the APK
        run: |
          OUT=studio/android/app/src/main/jniLibs
          cp cfbin/arm64 $OUT/arm64-v8a/libcloudflared.so
          cp cfbin/arm $OUT/armeabi-v7a/libcloudflared.so
          file $OUT/*/libcloudflared.so

      - name: Cache ffmpeg for Android
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ffbin
          key: ffmpeg-n6.1.1-${{ hashFiles('studio/tools/build_ffmpeg.sh') }}

      - name: Build ffmpeg for Android (stream copy + metadata cleaning only)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 -b n6.1.1 https://github.com/FFmpeg/FFmpeg ffsrc
          mkdir -p ffbin
          studio/tools/build_ffmpeg.sh $PWD/ffsrc $PWD/ffbin/arm64 arm64
          studio/tools/build_ffmpeg.sh $PWD/ffsrc $PWD/ffbin/arm arm

      - name: Add ffmpeg to the APK
        run: |
          OUT=studio/android/app/src/main/jniLibs
          cp ffbin/arm64 $OUT/arm64-v8a/libffmpeg.so
          cp ffbin/arm $OUT/armeabi-v7a/libffmpeg.so
          file $OUT/*/libffmpeg.so
          ls -la $OUT/*

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key
        env:
          KS: ${{ secrets.DC_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > $RUNNER_TEMP/drivecast.jks
            echo "DC_KEYSTORE_FILE=$RUNNER_TEMP/drivecast.jks" >> $GITHUB_ENV
          else
            echo "::warning::No DC_KEYSTORE_B64 secret — APK is signed with a temporary key. Add the secret so updates install over the old app."
          fi

      - name: Build APK
        working-directory: studio/android
        env:
          DC_KEYSTORE_PASS: ${{ secrets.DC_KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon -PdcVersionCode=${{ github.run_number }} -PdcVersionName=1.2.${{ github.run_number }}

      - name: Name APK
        run: |
          mkdir -p dist
          cp studio/android/app/build/outputs/apk/release/*.apk dist/DriveCast-Studio-1.2.${{ github.run_number }}.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: DriveCast-Studio-1.2.${{ github.run_number }}
          path: dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: server-1.2.${{ github.run_number }}
          name: DriveCast Studio 1.2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: dist/*.apk
          body: Install on the server phone. Allow “install unknown apps” for your browser when asked.
